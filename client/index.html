<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the theme before first paint to avoid a flash. Dark by default
      // (Orbit is dark-first) unless the user has previously chosen light.
      try { if (localStorage.getItem('appTheme') !== 'light') document.documentElement.classList.add('dark'); }
      catch (e) { document.documentElement.classList.add('dark'); }
    </script>
    <link rel="icon" type="image/svg+xml" href="/orbit-icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08060f" />
    <link rel="canonical" href="https://www.orbitexpense.me/" />
    <meta name="description" content="Orbit — a smart expense, budget, and tuition tracker for USC students, with AI insights and backup/restore." />
    <meta property="og:title" content="Orbit — Expense Tracker" />
    <meta property="og:description" content="Track expenses, income, budgets, and USC tuition installments with AI-powered insights." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.orbitexpense.me/" />
    <meta property="og:site_name" content="Orbit" />
    <meta property="og:image" content="https://www.orbitexpense.me/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Orbit: the finance hub built for student life." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Orbit — Expense Tracker" />
    <meta name="twitter:description" content="Stay ahead of spending with dashboards, reports, and proactive budget alerts." />
    <meta name="twitter:image" content="https://www.orbitexpense.me/og-image.png" />
    <meta name="twitter:image:alt" content="Orbit: the finance hub built for student life." />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Orbit — Expense Tracker",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web",
        "description": "Track expenses, income, budgets, and tuition payments with analytics and export/backup tools.",
        "url": "https://www.orbitexpense.me",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
    <title>Orbit — Expense Tracker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Fetched now, applied by src/index.tsx: a stylesheet link here held up the
         first paint by most of a second on a phone (U7), and the CSP forbids the
         inline onload trick. Text shows in the fallback font until it arrives. -->
    <link id="font-css" rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
