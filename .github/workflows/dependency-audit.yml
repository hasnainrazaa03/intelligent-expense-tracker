name: Dependency Audit

on:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    paths:
      - "client/package*.json"
      - "server/package*.json"
      - ".github/workflows/dependency-audit.yml"
  workflow_dispatch:

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [client, server]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install deps
        working-directory: ${{ matrix.project }}
        run: npm ci

      # Two bars. Code that runs in production must have no high or critical
      # advisory. Build and test tools (Vite, Vitest, Playwright, ts-node-dev)
      # fail only on critical ones: their inputs are our own config and code,
      # and an unfixable high advisory in one (picomatch, Nov 2026) failed
      # every dependency PR. Critical still catches cases like the Vite
      # dev-server RCE (GHSA-p4f5-76q4-ffq7).
      - name: Run npm audit (production dependencies, high+)
        working-directory: ${{ matrix.project }}
        run: npm audit --omit=dev --audit-level=high

      - name: Run npm audit (all dependencies, critical)
        working-directory: ${{ matrix.project }}
        run: npm audit --audit-level=critical
