version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # react and react-dom must be the exact same version: React refuses to
      # start otherwise (error #527, a blank page). Bumping react alone (as a
      # separate PR once did) passes the build but breaks the site.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # The compiler (@tailwindcss/postcss, which carries its own tailwindcss)
      # and the CSS it imports must match: #181 bumped tailwindcss alone, so the
      # build compiled with 4.3.3 against 4.3.5's stylesheet.
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
    # jspdf majors were ignored while jspdf-autotable 3 required jspdf 2. Since
    # jspdf-autotable 5 (peer: jspdf ^2 || ^3 || ^4) they are allowed again; the
    # E2E "PDF exports" test checks each bump still draws the report.

  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # Prisma 7 requires a driver adapter and ships none for MongoDB, so
      # `new PrismaClient()` throws at boot. Stay on 6.x (see README).
      - dependency-name: "prisma"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@prisma/client"
        update-types:
          - "version-update:semver-major"
